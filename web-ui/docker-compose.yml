services:
  backend:
    build:
      context: ..
      dockerfile: web-ui/backend/Dockerfile
    container_name: hyperche-backend
    environment:
      HYPERCHE_SETTINGS_FILE: /app/settings.json
      HYPERCHE_SQLITE_PATH: /app/runtime/hyperche_app.db
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in web-ui/.env}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?Set APP_SECRET_KEY in web-ui/.env}
      HYPERCHE_ADMIN_EMAIL: ${HYPERCHE_ADMIN_EMAIL:-}
      HYPERCHE_ADMIN_PASSWORD: ${HYPERCHE_ADMIN_PASSWORD:-}
      HYPERCHE_CACHE_SEED_DIR: /app/cache_seed/case1
      HYPERCHE_CACHE_RUNTIME_DIR: /app/hyperrag_cache/case1
    volumes:
      - ./backend/settings.json:/app/settings.json
      - ./backend/hyperrag_cache/case1:/app/cache_seed/case1:ro
      - hyperche_case1:/app/hyperrag_cache/case1
      - hyperche_runtime:/app/runtime
      - hyperche_uploads:/app/uploads
      - hyperche_knowledge_bases:/app/knowledge_bases
    expose:
      - "8000"
    networks:
      - hyperche-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_SERVER_URL: /api
    container_name: hyperche-frontend
    depends_on:
      - backend
    expose:
      - "5000"
    networks:
      - hyperche-network
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: hyperche-nginx
    depends_on:
      - frontend
      - backend
    ports:
      - "${WEB_PORT:-5000}:5000"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - hyperche-network
    restart: unless-stopped

networks:
  hyperche-network:
    driver: bridge

volumes:
  hyperche_case1:
  hyperche_runtime:
  hyperche_uploads:
  hyperche_knowledge_bases:
