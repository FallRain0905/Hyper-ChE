# HTTP bootstrap for certificate issuance. This file does not edit any other
# virtual host. Replace with nginx.host.https.conf after obtaining the cert.
map $http_upgrade $hyperche_host_connection_upgrade {
    default upgrade;
    "" close;
}

server {
    listen 80;
    listen [::]:80;
    server_name cupzhouth.top;
    client_max_body_size 200m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/hyperche-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $hyperche_host_connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
