# This listener is exposed only on the host loopback address. The host Nginx
# replaces client-supplied forwarding headers before forwarding here.
map $http_x_forwarded_proto $hyperche_forwarded_proto {
    default $scheme;
    http http;
    https https;
}
map $http_x_real_ip $hyperche_client_ip {
    "" $remote_addr;
    default $http_x_real_ip;
}
map $http_upgrade $hyperche_connection_upgrade {
    default upgrade;
    "" close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 200m;

    location /api/ws {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $hyperche_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $hyperche_client_ip;
        proxy_set_header X-Forwarded-For $hyperche_client_ip;
        proxy_set_header X-Forwarded-Proto $hyperche_forwarded_proto;
        proxy_read_timeout 3600s;
    }

    location /api/public/demo/query/stream {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $hyperche_client_ip;
        proxy_set_header X-Forwarded-For $hyperche_client_ip;
        proxy_set_header X-Forwarded-Proto $hyperche_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $hyperche_client_ip;
        proxy_set_header X-Forwarded-For $hyperche_client_ip;
        proxy_set_header X-Forwarded-Proto $hyperche_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    location / {
        proxy_pass http://frontend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $hyperche_client_ip;
        proxy_set_header X-Forwarded-For $hyperche_client_ip;
        proxy_set_header X-Forwarded-Proto $hyperche_forwarded_proto;
    }
}
