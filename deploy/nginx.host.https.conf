map $http_upgrade $hyperche_host_connection_upgrade {
    default upgrade;
    "" close;
}

server {
    listen 80;
    listen [::]:80;
    server_name hyperche.fallrain0905.top;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/hyperche-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hyperche.fallrain0905.top;
    ssl_certificate /etc/letsencrypt/live/hyperche.fallrain0905.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hyperche.fallrain0905.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:HyperChETLS:10m;
    ssl_session_timeout 1d;
    client_max_body_size 200m;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Replace rather than append incoming forwarding headers. The app's
        # public quota uses this server-derived client IP, not a supplied one.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $hyperche_host_connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }
}
